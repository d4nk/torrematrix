<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Torre Matrix LLC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Titillium+Web:wght@400;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--plate:#17191a;--line:#2c2e2d;--ink:#ecefe6;--sub:#aab097;--green:#15d33e;
--display:"Aldrich",system-ui,sans-serif;--body:"Titillium Web",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--data:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.plate{max-width:520px;width:100%;background:var(--plate);border:1px solid var(--line);border-radius:14px;padding:32px 24px;text-align:center}
.plate img{width:180px;height:auto;display:block;margin:0 auto 20px}
.code{font-family:var(--data);font-weight:600;color:var(--green);letter-spacing:.08em;font-size:14px;margin:0 0 8px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:0 0 12px}
p{color:var(--sub);margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:10px;font-weight:600;text-decoration:none}
a.primary{background:var(--green);color:#07080a}
a.ghost{border:1px solid var(--line);color:var(--ink)}
a.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="plate">
    <img src="/logo-440.webp" width="440" height="357" alt="Torre Matrix LLC logo">
    <p class="code">ERROR 404</p>
    <h1>We could not find that page.</h1>
    <p>The link may be old or mistyped. Everything we do is on the home page, or give us a call.</p>
    <div class="btns">
      <a class="btn primary" href="/">Go to the home page</a>
      <a class="btn ghost" href="tel:+14422342863">Call (442) 234-2863</a>
    </div>
  </div>
</main>
</body>
</html>
